<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LABELSystem キャプション管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">LABELSystem</a>
    <label class="event-picker">
      <span>イベント</span>
      <select id="event-select" aria-label="イベント"></select>
    </label>
    <button type="button" class="btn btn-quiet" id="manage-events">イベント管理</button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
