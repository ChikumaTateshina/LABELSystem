<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>キャプションへ登録</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>作品登録</h1>

  <div id="message" class="message" role="status" hidden></div>

  <form id="form" hidden>
    <label>タイトル
      <input id="title" type="text" autocomplete="off">
    </label>
    <label>ユーザ名
      <input id="userDisplayName" type="text" autocomplete="off">
    </label>
    <label>ユーザID
      <input id="userId" type="text" autocomplete="off" placeholder="@example">
    </label>
    <label>コメント
      <textarea id="comment" rows="6"></textarea>
    </label>
    <label>元投稿
      <input id="sourcePostUrl" type="url" autocomplete="off" placeholder="https://x.com/…/status/…">
    </label>
    <div class="actions">
      <button type="button" id="cancel">キャンセル</button>
      <button type="submit" id="submit" class="primary">登録</button>
    </div>
  </form>

  <div id="extra" class="actions" hidden></div>

  <details class="settings">
    <summary>設定</summary>
    <label>キャプションサーバのURL
      <input id="serverUrl" type="url" autocomplete="off">
    </label>
    <button type="button" id="saveSettings">保存</button>
  </details>

  <script src="popup.js"></script>
</body>
</html>
