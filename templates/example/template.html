<!--
  HTML出力用テンプレート（任意）。キャプション1枚分の中身だけを書きます。
  出力時に <article class="caption"> で包まれ、template.css が <style> として埋め込まれます。
-->
<p class="caption-category">{{category}}</p>
<p class="caption-number">{{entry_number}}</p>
<h1 class="caption-title">{{title}}</h1>
<hr class="caption-rule">
<p class="caption-username">{{username}}</p>
<p class="caption-userid">{{userid}}</p>
<p class="caption-comment">{{comment}}</p>
