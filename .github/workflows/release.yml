name: Release

# v1.2.3 形式のタグをpushすると、インストール不要の実行ファイルとブラウザ拡張をReleaseへ添付する（仕様 §86）
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    # 配布する exe は Windows 用のため、Windows 上でビルドする
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build:exe

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path extension/dist/* -DestinationPath "label-system-extension-$env:GITHUB_REF_NAME.zip"

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/LABELSystem.exe "label-system-extension-$env:GITHUB_REF_NAME.zip" --generate-notes
